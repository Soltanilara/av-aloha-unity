[project]
name = "gvlink"
version = "0.1.0"
description = "Guided-Vision robot-side link: stereo video sender, protocol, and bench tools"
requires-python = ">=3.10"
dependencies = [
    "av>=13.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "psutil>=5.9",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gvlink"]
