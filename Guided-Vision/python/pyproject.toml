[project]
name = "gvlink"
version = "0.1.0"
description = "Quest VR Teleoperation robot-side link: stereo video sender, protocol, and bench tools"
requires-python = ">=3.10"
dependencies = [
    "av>=13.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "psutil>=5.9",
    "msgpack>=1.0",
]

[project.optional-dependencies]
# Visualisation only. Kept out of the default set because a robot does not need a web
# viewer in order to stream, and this pulls in a websocket and asset stack that has no
# business on a machine whose job is encoding frames.  Install with: uv sync --extra viz
viz = ["viser>=0.2"]
# OAK-D stereo capture only. Install with: uv sync --extra oak
# Pinned exactly: 3.6+ ships RVC2 firmware that heap-crashes the OAK-D on any stream
# config, and <3.5 has no Camera.setSensorType, without which the OV9782 is driven as
# the mono OV9282 it misreports itself as -- see gvlink/oakcam.py.
oak = ["depthai==3.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gvlink"]
